spring:
  application:
    name: agridirect-backend
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 20000
      maximum-pool-size: 5
      minimum-idle: 1
      initialization-fail-timeout: 0
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

razorpay:
  key-id: ${RAZORPAY_KEY_ID}
  key-secret: ${RAZORPAY_KEY_SECRET}
  webhook-secret: ${RAZORPAY_WEBHOOK_SECRET}

gemini:
  api-key: ${GEMINI_API_KEY:}
  api-url: https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent

xai:
  api-key: ${XAI_API_KEY:}

groq:
  api-key: ${GROQ_API_KEY:}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}

google-maps:
  api-key: ${GOOGLE_MAPS_API_KEY:}

delivery:
  base-cost: ${DELIVERY_BASE_COST:50}
  per-km-cost: ${DELIVERY_PER_KM_COST:8}
  per-minute-cost: ${DELIVERY_PER_MINUTE_COST:1}
  min-delivery-radius-km: ${MIN_DELIVERY_RADIUS:0.5}
  max-delivery-radius-km: ${MAX_DELIVERY_RADIUS:25}
  delivery-partner-search-radius-km: ${DELIVERY_PARTNER_SEARCH_RADIUS:5}

server:
  port: ${PORT:8080}
